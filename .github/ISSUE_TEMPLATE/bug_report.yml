name: Reportar un error
description: Informa un fallo reproducible de Elite Pen.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por ayudar. No publiques vulnerabilidades ni datos privados; consulta SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Versión de Elite Pen
      placeholder: "2.7.1 · portable o instalada"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Equipo
      placeholder: "Windows 11 24H2, 1920×1080, 125 %, Intel UHD..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Indica una secuencia mínima y repetible.
      placeholder: |
        1. Abro...
        2. Selecciono...
        3. Ocurre...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado real
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Número de monitores, DPI, GPU, modo de zoom y cualquier solución temporal.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: Confirmo que retiré información privada de capturas, registros y archivos.
          required: true
